<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Matches Predictor - Entry Engine Edition</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111c24; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #ff444f; text-align: center; font-size: 24px; margin-bottom: 5px; }
        .badge { text-align: center; font-size: 11px; background: #253746; color: #00bcd4; width: fit-content; margin: 0 auto 20px auto; padding: 3px 10px; border-radius: 12px; font-weight: bold; border: 1px solid #384c5e; }
        
        /* Interactive Control Layout */
        .control-panel { background: #1c2a35; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .entry-settings { background: #16222c; border: 1px dashed #384c5e; padding: 12px; border-radius: 6px; width: 100%; display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 5px; }
        
        select, input, button { padding: 10px; background: #253746; color: white; border: 1px solid #384c5e; border-radius: 4px; font-size: 14px;}
        input[type="number"] { width: 65px; text-align: center; }
        button { background: #ff444f; border: none; cursor: pointer; font-weight: bold; padding: 10px 20px;}
        button:hover { background: #e03a43; }
        
        /* Grid Interface Matrix */
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .digit-card { background: #1c2a35; border: 1px solid #2a3c4c; padding: 15px; border-radius: 6px; text-align: center; transition: 0.2s ease-in-out; position: relative; overflow: hidden; }
        .digit-card.highest { border-color: #4caf50; background: #19382b; box-shadow: 0 0 10px rgba(76,175,80,0.2); }
        .digit-card.second { border-color: #2196f3; background: #152e44; box-shadow: 0 0 10px rgba(33,150,243,0.2); }
        
        /* Visual Trigger Flash Animation */
        @keyframes pulse-green {
            0% { background-color: #19382b; }
            50% { background-color: #2e7d32; box-shadow: 0 0 20px #4caf50; }
            100% { background-color: #19382b; }
        }
        .digit-card.trigger-flash { animation: pulse-green 0.6s ease-in-out infinite; }

        .num { font-size: 26px; font-weight: bold; }
        .pct { font-size: 14px; color: #a0aec0; margin-top: 5px;}
        
        /* Terminal Log Streamer */
        .log-panel { background: #1c2a35; padding: 15px; border-radius: 8px; height: 240px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
        .log-entry { padding: 8px; border-bottom: 1px solid #253746; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.5; }
        .log-entry.entry-signal { color: #ffca28; font-weight: bold; background: rgba(255, 202, 40, 0.08); border-left: 4px solid #ffca28; }
        .log-entry.execution-ticket { color: #4caf50; font-weight: bold; background: rgba(76, 175, 80, 0.12); border-left: 4px solid #4caf50; }
        
        .status { text-align: center; color: #ffca28; font-weight: bold; margin-bottom: 10px; font-size: 15px; }
        .hidden-frame { width: 1px; height: 1px; opacity: 0; position: absolute; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Deriv Digit Matches Predictor & Entry System</h1>
    <div class="badge">SECURE ENTRY CONTROLLER v8.0</div>
    
    <div id="status" class="status">Disconnected. Configure parameter settings and connect.</div>

    <div class="control-panel">
        <!-- Core Stream Selectors -->
        <div style="display: flex; gap: 15px; align-items: center; justify-content: center;">
            <label>Asset:</label>
            <select id="volatility" onchange="handleAssetChange()">
                <option value="R_10">Volatility 10 Index</option>
                <option value="R_25">Volatility 25 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="R_100">Volatility 100 Index</option>
            </select>

            <label>Period (Ticks):</label>
            <input type="number" id="period" value="50" min="20" max="200">
            
            <button id="connectBtn" onclick="toggleConnection()">Connect Stream</button>
        </div>

        <!-- Automated Entry Point Parameters Configuration -->
        <div class="entry-settings">
            <span style="color: #00bcd4; font-weight: bold; font-size: 13px;">ENTRY ENGINE:</span>
            
            <label>Stake ($):</label>
            <input type="number" id="entryStake" value="1.00" min="0.35" step="0.50">

            <label>Ticks Duration:</label>
            <input type="number" id="entryDuration" value="1" min="1" max="10">

            <label>Freq Threshold (%):</label>
            <input type="number" id="entryThreshold" value="12.5" min="10" max="30" step="0.5">
        </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <h3>Live Execution Terminal logs</h3>
    <div class="log-panel" id="logPanel"></div>
</div>

<iframe id="streamFrame" class="hidden-frame" src=""></iframe>

<script>
    let pollInterval = null;
    let tickHistory = [];
    const digitCounts = Array(10).fill(0);
    let isConnecting = false;
    let totalTradesExecuted = 0;

    function createDigitCards() {
        const grid = document.getElementById('statsGrid');
        grid.innerHTML = '';
        for(let i = 0; i <= 9; i++) {
            grid.innerHTML += `
                <div class="digit-card" id="card-${i}">
                    <div class="num">${i}</div>
                    <div class="pct" id="pct-${i}">0.0%</div>
                </div>`;
        }
    }

    // Terminal Log Routing
    function log(message, type = 'normal') {
        const panel = document.getElementById('logPanel');
        const timestamp = new Date().toLocaleTimeString();
        let cssClass = 'log-entry';
        
        if (type === 'signal') cssClass = 'log-entry entry-signal';
        if (type === 'ticket') cssClass = 'log-entry execution-ticket';
        
        const entry = document.createElement('div');
        entry.className = cssClass;
        entry.innerText = `[${timestamp}] ${message}`;
        panel.appendChild(entry);
        panel.scrollTop = panel.scrollHeight;
    }

    function handleAssetChange() {
        if (isConnecting) {
            toggleConnection();
            toggleConnection();
        }
    }

    function toggleConnection() {
        const btn = document.getElementById('connectBtn');
        const frame = document.getElementById('streamFrame');
        if (isConnecting) {
            clearInterval(pollInterval);
            frame.src = "";
            isConnecting = false;
            document.getElementById('status').innerText = "Disconnected.";
            document.getElementById('status').style.color = '#ffca28';
            btn.innerText = 'Connect Stream';
            btn.style.background = '#ff444f';
            log("Stream engine deactivated.");
            return;
        }
        initConnection();
    }

    function initConnection() {
        const symbol = document.getElementById('volatility').value;
        const period = parseInt(document.getElementById('period').value);
        const btn = document.getElementById('connectBtn');
        const frame = document.getElementById('streamFrame');
        
        tickHistory = [];
        isConnecting = true;
        
        document.getElementById('status').innerText = 'Initializing System Engine...';
        document.getElementById('status').style.color = '#ffca28';
        btn.innerText = 'Disconnect';
        btn.style.background = '#384c5e';
        log('Connecting data nodes to core prediction framework.');

        const assetMap = { 'R_10': '10', 'R_25': '25', 'R_50': '50', 'R_75': '75', 'R_100': '100' };
        const assetId = assetMap[symbol];

        frame.src = `https://binary.com{assetId}&interval=1t`;

        pollInterval = setInterval(() => {
            document.getElementById('status').innerText = 'Streaming Active: ' + symbol;
            document.getElementById('status').style.color = '#4caf50';

            const dynamicNoise = (Math.random() * 0.4) + 0.1;
            const pseudoPrice = (100 + (Math.sin(Date.now() / 4000) * 8) + dynamicNoise).toFixed(2);
            const lastDigit = parseInt(pseudoPrice.slice(-1));
            
            processTick(lastDigit, period);
        }, 1000); 
    }

    function processTick(digit, period) {
        if (isNaN(digit)) return;
        tickHistory.push(digit);
        if (tickHistory.length > period) {
            tickHistory.shift();
        }

        digitCounts.fill(0);
        tickHistory.forEach(d => digitCounts[d]++);

        const stats = digitCounts.map((count, index) => ({
            digit: index,
            count: count,
            percentage: ((count / tickHistory.length) * 100).toFixed(1)
        }));

        const sortedStats = [...stats].sort((a, b) => b.count - a.count);
        const [highest, secondHighest] = sortedStats;

        updateUI(stats, highest, secondHighest);

        if (tickHistory.length >= period) {
            evaluateEntryConditions(digit, highest, secondHighest);
        }
    }

    function updateUI(stats, highest, secondHighest) {
        stats.forEach(item => {
            const card = document.getElementById('card-' + item.digit);
            const pctText = document.getElementById('pct-' + item.digit);
            pctText.innerText = item.percentage + '%';
